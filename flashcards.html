<!DOCTYPE html>
<!-- ============================================================
     flashcards.html — INTERACTIVE FLASHCARD PAGE
     This page is shared by all 6 subjects.
     It reads the URL (e.g. ?subject=calculus) to figure out
     which deck to load, then displays the cards one at a time.
     All the card data and logic lives in script.js.
     ============================================================ -->
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <title>Flashcards — AP Study Hub</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<nav class="nav">
  <div class="nav-logo"><span>AP</span> Study Hub</div>
  <ul class="nav-links">
    <li><a href="index.html">Home</a></li>
    <li><a href="study.html">Study</a></li>
  </ul>
</nav>

<!-- Back link — JavaScript updates this href to go back to the correct subject page -->
<a id="fc-back-link" href="study.html" class="back-link">← Back to Study Guide</a>

<!-- Main content wrapper — keeps cards centered on screen -->
<div class="fc-page">

  <!-- ── HEADER ────────────────────────────────────────────
       Shows the subject name, current card number (e.g. 3/18),
       and the live score (how many known vs still learning)
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-header">
    <h1 id="fc-title">Flashcards</h1>
    <div class="fc-meta-row">
      <span class="fc-counter" id="fc-counter">1 / —</span>
      <span class="fc-score" id="fc-score">✓ 0  ✗ 0</span>
    </div>
  </div>

  <!-- ── PROGRESS BAR ───────────────────────────────────────
       A thin bar that fills up as the student moves through cards
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-progress">
    <div class="fc-progress-bar" id="fc-bar"></div>
  </div>

  <!-- ── FLASHCARD ─────────────────────────────────────────
       The 3D card with two sides — front (term) and back (answer).
       Clicking anywhere on the card triggers the flip animation.
       The CSS handles the actual 3D rotation effect.
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-scene" onclick="flipCard()">
    <div class="fc-card" id="fc-card">

      <div class="fc-face fc-front">
        <div class="fc-face-label">Term / Concept</div>
        <div class="fc-face-text" id="fc-front-text">Loading…</div>
        <div class="fc-tap-hint">Tap to reveal answer</div>
      </div>

      <div class="fc-face fc-back">
        <div class="fc-face-label">Definition / Explanation</div>
        <div class="fc-face-text" id="fc-back-text"></div>
      </div>

    </div>
  </div>

  <!-- ── SELF-GRADING BUTTONS ──────────────────────────────
       Lets the student mark each card as known or still learning.
       Updates the score display and moves to the next card.
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-controls">
    <button class="fc-btn unknown" onclick="markUnknown()">✗ Still Learning</button>
    <button class="fc-btn known"   onclick="markKnown()">✓ Got It</button>
  </div>

  <!-- ── NAVIGATION CONTROLS ────────────────────────────────
       Prev/Next move through the deck.
       Flip button does the same as clicking the card.
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-nav-row">
    <button class="fc-btn" id="fc-prev" onclick="prevCard()">← Prev</button>
    <button class="fc-flip-btn"         onclick="flipCard()">🔄 Flip</button>
    <button class="fc-btn" id="fc-next" onclick="nextCard()">Next →</button>
  </div>

  <!-- ── UTILITY BUTTONS ────────────────────────────────────
       Shuffle randomly reorders the deck.
       Restart resets to the original order and clears the score.
  ─────────────────────────────────────────────────────────── -->
  <div class="fc-util-row">
    <button class="fc-util-btn" onclick="shuffleDeck()">🔀 Shuffle</button>
    <button class="fc-util-btn" onclick="restartDeck()">↩ Restart</button>
  </div>

</div>

<footer><strong>AP Study Hub</strong> · Content aligned with College Board standards</footer>
<script src="script.js"></script>
</body>
</html>
